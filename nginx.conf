upstream geo_server {
    server geo-app:3000;
}

upstream harvester_api {
    server harvester:3003;
}

upstream harvester_vnc {
    server harvester:6080;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # API routes -> GEO server
    location /api/ {
        proxy_pass http://geo_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Harvester API -> harvester service
    location /harvester-api/ {
        rewrite ^/harvester-api/(.*)$ /$1 break;
        proxy_pass http://harvester_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # noVNC web client -> harvester noVNC
    location /novnc/ {
        proxy_pass http://harvester_vnc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Websocket for VNC
    location /websockify {
        proxy_pass http://harvester_vnc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Static web files (SPA fallback)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
