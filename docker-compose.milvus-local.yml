# Milvus Standalone（本地存储版，无需 MinIO）— 网络受限时备用
# 启动：docker compose -f docker-compose.milvus-local.yml up -d
# 与 docker-compose.milvus.yml 互斥：共用同名容器/卷时请二选一
version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus-etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.12
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # 关键：用本地磁盘替代 MinIO 对象存储
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-standalone:/var/lib/milvus
    ports:
      - "19530:19530"   # Milvus gRPC
      - "9091:9091"     # Metrics / health
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  milvus-etcd:
  milvus-standalone:
