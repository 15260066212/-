version: "3.8"

services:
  # GEO Application (server + web build)
  geo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geo-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/geo-assistant.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
      - HARVESTER_URL=http://harvester:3003
      - RPA_REMOTE_URL=http://harvester:3003
      - RPA_HEADLESS=true
      - RPA_LLMWIKI_FALLBACK=true
      - AUTH_REQUIRE_API_KEY=${AUTH_REQUIRE_API_KEY:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
    volumes:
      - geo-data:/app/data
    networks:
      - geo-network

  # Cookie Harvester Service (Playwright + noVNC)
  harvester:
    build:
      context: .
      dockerfile: apps/harvester/Dockerfile
    container_name: geo-harvester
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3003
      - NOVNC_BASE_URL=/novnc
    ports:
      - "3003:3003"
      - "6080:6080"
    networks:
      - geo-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: geo-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
    ports:
      - "9000:80"
    depends_on:
      - geo-app
      - harvester
    networks:
      - geo-network

volumes:
  geo-data:

networks:
  geo-network:
    driver: bridge
